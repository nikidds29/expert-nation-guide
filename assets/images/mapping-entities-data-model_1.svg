  <text x="250.0" y="636.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Birth</text>
  <rect x="330" y="578" width="300" height="56" rx="9" fill="#edcdee"/>
  <text x="480.0" y="600.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Life event</text>
  <text x="480.0" y="621.0" text-anchor="middle" font-size="12" fill="#5a5c60">one template, two fields</text>
  <line x1="170" y1="674.0" x2="330" y2="674.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="664.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Other events</text>
  <rect x="330" y="646" width="300" height="56" rx="9" fill="#ebeecd"/>
  <text x="480.0" y="674.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Eventlet</text>
  <line x1="170" y1="742.0" x2="330" y2="742.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="732.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Death</text>
  <rect x="330" y="714" width="300" height="56" rx="9" fill="#cde6ee"/>
  <text x="480.0" y="742.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Death</text>
  <line x1="170" y1="810.0" x2="330" y2="810.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="800.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Occupations</text>
  <rect x="330" y="782" width="300" height="56" rx="9" fill="#eecde1"/>
  <text x="480.0" y="810.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Occupation eventlet</text>
  <line x1="170" y1="896.0" x2="330" y2="896.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="868.035" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Professional Assoc.</text>
    <text x="250.0" y="883.965" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Memberships</text>
  <rect x="330" y="868" width="300" height="56" rx="9" fill="#ddeecd"/>
  <text x="480.0" y="885.97" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Professional association</text>
    <text x="480.0" y="906.03" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">member</text>
  <line x1="170" y1="964.0" x2="330" y2="964.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="954.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">5 media fields</text>
  <rect x="330" y="936" width="300" height="56" rx="9" fill="#cdd8ee"/>
  <text x="480.0" y="964.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Digital media item</text>
  <line x1="170" y1="1032.0" x2="330" y2="1032.0" stroke="#55565a" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <text x="250.0" y="1022.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">9 URI fields</text>
  <rect x="330" y="1004" width="300" height="56" rx="9" fill="#ffffff" stroke="#55565a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="480.0" y="1026.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">External links</text>
  <text x="480.0" y="1046.0" text-anchor="middle" font-size="12.5" fill="#5a5c60">plain URLs, no template at all</text>
  <text x="480.0" y="982.0" text-anchor="middle" font-size="12" fill="#5a5c60">one template, several fields</text>
  <rect x="900" y="286.0" width="260" height="60" rx="10" fill="#d1cdee" stroke="#55565a" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="1030.0" y="316.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#1a1a1a">Scholarship award</text>
  <rect x="900" y="644.0" width="260" height="60" rx="10" fill="#eecdd3" stroke="#55565a" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="1030.0" y="674.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#1a1a1a">Place</text>
  <rect x="900" y="823.0" width="260" height="60" rx="10" fill="#ceeecd" stroke="#55565a" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="1030.0" y="853.0" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#1a1a1a">Organisation</text>
<polyline points="295.0,65.12 1195,65.12 1195,660.0 1160,660.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
  <text x="303.0" y="59.120000000000005" font-size="12" font-weight="600" fill="#3d3f44">Place of birth</text>
<polyline points="295.0,118.88 1210,118.88 1210,688.0 1160,688.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
  <text x="303.0" y="134.88" font-size="12" font-weight="600" fill="#3d3f44">Place of death</text>
<polyline points="630,606.0 697,606.0 697,674.0 900,674.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
<polyline points="630,674.0 713,674.0 713,674.0 900,674.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
<polyline points="630,742.0 729,742.0 729,674.0 900,674.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
<polyline points="630,316.0 663,316.0 663,316.0 900,316.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
<polyline points="630,810.0 663,810.0 663,853.0 900,853.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
<polyline points="630,896.0 679,896.0 679,853.0 900,853.0" fill="none" stroke="#55565a" stroke-width="1.6" marker-end="url(#arrowSmall)"/>
  <text x="24" y="1130" font-size="14" fill="#3d3f44">Pale colour = a linked record with its own resource template; Life event covers two fields (Life events and Birth).</text>
  <text x="24" y="1154" font-size="14" fill="#3d3f44">Right-hand column = templates reused inside more than one record above, so each is drawn once with several lines feeding in.</text>
  <text x="24" y="1178" font-size="14" fill="#3d3f44">Dashed, open box = the one exception: External links hold a plain web address, not a linked item at all.</text>
</svg>