<svg viewBox="0 0 1360 1226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the Person record data model in two tiers: Person links directly to twelve fields, each backed by a resource template (Life events and Birth share one Life event box). A second tier of shared templates, Place, Organisation and Scholarship award, are referenced from inside several of those templates own forms rather than directly from Person, so each is drawn once with several lines feeding in.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55565a"/></marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55565a"/></marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55565a"/></marker>
  </defs>
  <line x1="170" y1="134" x2="170" y2="1032.0" stroke="#55565a" stroke-width="2.5"/>
  <rect x="45.0" y="50" width="250" height="84" rx="12" fill="#e7e9ee" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="170" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="700" fill="#1a1a1a">Person</text>
  <text x="170" y="110.0" text-anchor="middle" font-size="13" fill="#3d3f44">the record every field below hangs off</text>
  <text x="330" y="180" font-size="13.5" font-weight="700" fill="#3d3f44">Linked directly from Person</text>
  <text x="900" y="180" font-size="13.5" font-weight="700" fill="#3d3f44">Reused inside other templates’ own forms</text>
  <line x1="170" y1="248.0" x2="330" y2="248.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="238.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Early education</text>
  <rect x="330" y="220" width="300" height="56" rx="9" fill="#eed6cd"/>
  <text x="480.0" y="248.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Schooling</text>
  <line x1="170" y1="316.0" x2="330" y2="316.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="306.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Tertiary education</text>
  <rect x="330" y="288" width="300" height="56" rx="9" fill="#cdeeda"/>
  <text x="480.0" y="316.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Tertiary study</text>
  <line x1="170" y1="384.0" x2="330" y2="384.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="374.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Related persons</text>
  <rect x="330" y="356" width="300" height="56" rx="9" fill="#dfcdee"/>
  <text x="480.0" y="384.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Relationship</text>
  <line x1="170" y1="452.0" x2="330" y2="452.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="442.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Military service</text>
  <rect x="330" y="424" width="300" height="56" rx="9" fill="#eee4cd"/>
  <text x="480.0" y="452.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Military service</text>
  <line x1="170" y1="520.0" x2="330" y2="520.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250.0" y="510.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="600" fill="#3d3f44">Military awards</text>
  <rect x="330" y="492" width="300" height="56" rx="9" fill="#cdeee9"/>
  <text x="480.0" y="520.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1a1a1a">Military award</text>
  <line x1="170" y1="594.0" x2="330" y2="594.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="618.0" x2="330" y2="618.0" stroke="#55565a" stroke-width="2" marker-end="url(#arrow)"/>
