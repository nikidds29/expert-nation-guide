<svg viewBox="0 0 1080 1370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the Person record data model: the Person item at the centre, connected to thirteen linked sub-record fields plus media fields, each backed by its own resource template (some templates, such as Place and Life event, used twice); External links is the one exception, holding a plain web address with no resource template at all.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <line x1="170" y1="130" x2="170" y2="1219.0" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="45.0" y="46" width="250" height="84" rx="12" fill="#1c1f23"/>
  <text x="170" y="76.0" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="700" fill="#ffffff">Person</text>
  <text x="170" y="106.0" text-anchor="middle" font-size="14" fill="#d7d9dc">the record every field below hangs off</text>
  <line x1="170" y1="227.0" x2="340" y2="227.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="217.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Early education</text>
  <rect x="340" y="200" width="340" height="54" rx="9" fill="#74311b"/>
  <text x="510.0" y="227.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Schooling</text>
  <line x1="170" y1="293.0" x2="340" y2="293.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="283.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Tertiary education</text>
  <rect x="340" y="266" width="340" height="54" rx="9" fill="#1b745e"/>
  <text x="510.0" y="293.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Tertiary study</text>
  <line x1="170" y1="359.0" x2="340" y2="359.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="349.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Place of birth</text>
  <rect x="340" y="332" width="340" height="54" rx="9" fill="#741b5e"/>
  <text x="510.0" y="359.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Place</text>
  <line x1="170" y1="425.0" x2="340" y2="425.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="415.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Life events</text>
  <rect x="340" y="398" width="340" height="54" rx="9" fill="#31741b"/>
  <text x="510.0" y="425.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Life event</text>
  <line x1="170" y1="491.0" x2="340" y2="491.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="481.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Related persons</text>
  <rect x="340" y="464" width="340" height="54" rx="9" fill="#311b74"/>
  <text x="510.0" y="491.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Relationship</text>
  <line x1="170" y1="557.0" x2="340" y2="557.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="547.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Place of death</text>
  <rect x="340" y="530" width="340" height="54" rx="9" fill="#741b5e"/>
  <text x="510.0" y="557.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Place</text>
  <line x1="170" y1="623.0" x2="340" y2="623.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="613.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Birth</text>
  <rect x="340" y="596" width="340" height="54" rx="9" fill="#31741b"/>
  <text x="510.0" y="623.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Life event</text>
  <line x1="170" y1="689.0" x2="340" y2="689.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="679.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Military service</text>
  <rect x="340" y="662" width="340" height="54" rx="9" fill="#745e1b"/>
  <text x="510.0" y="689.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Military service</text>
  <line x1="170" y1="755.0" x2="340" y2="755.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="745.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Military awards</text>
  <rect x="340" y="728" width="340" height="54" rx="9" fill="#1b5e74"/>
  <text x="510.0" y="755.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Military award</text>
  <line x1="170" y1="821.0" x2="340" y2="821.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="811.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Occupations</text>
  <rect x="340" y="794" width="340" height="54" rx="9" fill="#741b31"/>
  <text x="510.0" y="821.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Occupation eventlet</text>
  <line x1="170" y1="905.0" x2="340" y2="905.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="876.74" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Professional Assoc.</text>
    <text x="255.0" y="893.26" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Memberships</text>
  <rect x="340" y="878" width="340" height="54" rx="9" fill="#1b7431"/>
  <text x="510.0" y="894.97" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Professional association</text>
    <text x="510.0" y="915.03" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">member</text>
  <line x1="170" y1="971.0" x2="340" y2="971.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="961.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Other events</text>
  <rect x="340" y="944" width="340" height="54" rx="9" fill="#5e1b74"/>
  <text x="510.0" y="971.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Eventlet</text>
  <line x1="170" y1="1037.0" x2="340" y2="1037.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="1027.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">Death</text>
  <rect x="340" y="1010" width="340" height="54" rx="9" fill="#5e741b"/>
  <text x="510.0" y="1037.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Death</text>
  <line x1="170" y1="1145.0" x2="340" y2="1145.0" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255.0" y="1135.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">5 media fields</text>
  <rect x="340" y="1118" width="340" height="54" rx="9" fill="#1b3174"/>
  <text x="510.0" y="1137.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#ffffff">Digital media item</text>
  <text x="510.0" y="1159.0" text-anchor="middle" font-size="12.5" fill="#c9d0e0">one template, several fields</text>
  <line x1="170" y1="1219.0" x2="340" y2="1219.0" stroke="#4b5563" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <text x="255.0" y="1209.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#2d2d2a">9 URI fields</text>
  <rect x="340" y="1192" width="340" height="54" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="510.0" y="1211.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1c1f23">External links</text>
  <text x="510.0" y="1233.0" text-anchor="middle" font-size="12.5" fill="#4b5563">plain URLs, no template at all</text>
  <text x="24" y="1294" font-size="14" fill="#2d2d2a">Solid colour = a linked record with its own resource template.</text>
  <text x="24" y="1318" font-size="14" fill="#2d2d2a">Place, Life event and Digital media item each cover more than one field, so they get more than one box.</text>
  <text x="24" y="1342" font-size="14" fill="#2d2d2a">Dashed, open box = the one exception: External links hold a plain web address, not a linked item.</text>
</svg>